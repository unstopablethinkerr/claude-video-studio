<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Claude Video Studio: how it works</title>
  <desc id="d">Raw footage goes to Claude Code, then HyperFrames, Whisper captions, an optional Jarvis Labs GPU, and finally an MP4 video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2431"/>
      <stop offset="1" stop-color="#171a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c9cff"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="60" r="220" fill="#7c9cff" opacity="0.08"/>
  <circle cx="90" cy="600" r="180" fill="#b48cff" opacity="0.07"/>

  <text x="640" y="118" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="58" font-weight="700" fill="#e8eaf0">Claude Video Studio</text>
  <text x="640" y="166" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" fill="#9aa3b2">Edit videos by talking to Claude. Heavy work can run on a rented GPU.</text>

  <!-- connectors -->
  <g stroke="#7c9cff" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.9">
    <line x1="222" y1="340" x2="252" y2="340"/>
    <line x1="422" y1="340" x2="452" y2="340"/>
    <line x1="622" y1="340" x2="652" y2="340"/>
    <line x1="822" y1="340" x2="852" y2="340"/>
    <line x1="1022" y1="340" x2="1052" y2="340"/>
  </g>

  <!-- nodes -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">
    <g>
      <rect x="60" y="275" width="160" height="130" rx="18" fill="url(#node)" stroke="#2e3546" stroke-width="2"/>
      <text x="140" y="324" font-size="24" font-weight="700" fill="#e8eaf0">Raw</text>
      <text x="140" y="354" font-size="24" font-weight="700" fill="#e8eaf0">footage</text>
      <text x="140" y="384" font-size="17" fill="#9aa3b2">raws/</text>
    </g>
    <g>
      <rect x="260" y="275" width="160" height="130" rx="18" fill="url(#node)" stroke="#2e3546" stroke-width="2"/>
      <text x="340" y="324" font-size="24" font-weight="700" fill="#e8eaf0">Claude</text>
      <text x="340" y="354" font-size="24" font-weight="700" fill="#e8eaf0">Code</text>
      <text x="340" y="384" font-size="17" fill="#9aa3b2">writes HTML</text>
    </g>
    <g>
      <rect x="460" y="275" width="160" height="130" rx="18" fill="url(#node)" stroke="#2e3546" stroke-width="2"/>
      <text x="540" y="324" font-size="24" font-weight="700" fill="#e8eaf0">HyperFrames</text>
      <text x="540" y="354" font-size="17" fill="#9aa3b2">lint, preview</text>
      <text x="540" y="384" font-size="17" fill="#9aa3b2">and render</text>
    </g>
    <g>
      <rect x="660" y="275" width="160" height="130" rx="18" fill="url(#node)" stroke="#2e3546" stroke-width="2"/>
      <text x="740" y="324" font-size="24" font-weight="700" fill="#e8eaf0">Whisper</text>
      <text x="740" y="354" font-size="17" fill="#9aa3b2">captions and</text>
      <text x="740" y="384" font-size="17" fill="#9aa3b2">subtitles</text>
    </g>
    <g>
      <rect x="860" y="275" width="160" height="130" rx="18" fill="url(#node)" stroke="#2e3546" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="940" y="324" font-size="24" font-weight="700" fill="#e8eaf0">Jarvis GPU</text>
      <text x="940" y="354" font-size="17" fill="#9aa3b2">optional, billed</text>
      <text x="940" y="384" font-size="17" fill="#9aa3b2">by the hour</text>
    </g>
    <g>
      <rect x="1060" y="275" width="160" height="130" rx="18" fill="url(#accent)" filter="url(#glow)"/>
      <text x="1140" y="330" font-size="30" font-weight="800" fill="#0f1115">MP4</text>
      <text x="1140" y="366" font-size="18" fill="#0f1115">outputs/</text>
    </g>
  </g>

  <text x="640" y="500" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#e8eaf0">Your video is written as HTML, so Claude can edit it like any other code.</text>
  <text x="640" y="540" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" fill="#9aa3b2">Run it on your laptop, or send the heavy steps to a cloud GPU.</text>
</svg>
